<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="580" viewBox="0 0 1600 580" role="img" aria-labelledby="title desc">
  <title id="title">Two ways to move work forward in Pi</title>
  <desc id="desc">Choose recipes for product work with named specialists and review gates, or approve a scripted workflow to coordinate parallel workers and collect results. Scripted runs can be watched, paused, resumed or saved.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#060A12"/>
      <stop offset="0.52" stop-color="#0B1120"/>
      <stop offset="1" stop-color="#080C16"/>
    </linearGradient>
    <radialGradient id="blueBloom" cx="0.32" cy="0.28" r="0.8">
      <stop stop-color="#2563EB" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetBloom" cx="0.6" cy="0.85" r="0.65">
      <stop stop-color="#8B5CF6" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#172238" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#0E1525" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="focus" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#172554" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#312E81" stop-opacity="0.58"/>
    </linearGradient>
    <pattern id="dotGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#94A3B8" fill-opacity="0.08"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#02040A" flood-opacity="0.5"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1 11 6 1 11Z" fill="#60A5FA"/>
    </marker>
    <marker id="arrowViolet" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1 11 6 1 11Z" fill="#A78BFA"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1 11 6 1 11Z" fill="#34D399"/>
    </marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, Arial, sans-serif; }
      .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
      .card-title { font-size: 34px; font-weight: 650; fill: #F8FAFC; }
      .copy { font-size: 26px; font-weight: 450; fill: #B3C1D5; }
      .connector { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Solid canvas and restrained depth: dark fleet design tokens. -->
  <rect width="1600" height="580" fill="url(#canvas)"/>
  <rect width="1600" height="580" fill="url(#blueBloom)"/>
  <rect width="1600" height="580" fill="url(#violetBloom)"/>
  <rect width="1600" height="580" fill="url(#dotGrid)"/>
  <g class="sans">
    <text x="64" y="82" font-size="48" font-weight="720" letter-spacing="-1.2" fill="#F8FAFC">Two ways to move work forward</text>
    <text x="64" y="126" class="copy">Pick the path that fits your task.</text>
  </g>
  <g transform="translate(1406 54)">
    <rect width="130" height="40" rx="20" fill="#111A2A" stroke="#293750"/>
    <text x="65" y="27" text-anchor="middle" class="mono" font-size="20" font-weight="700" fill="#B9C7DD">IN PI</text>
  </g>

  <!-- Alternative branches share one entry; neither lane depends on the other. -->
  <g class="connector">
    <path d="M388 331H424Q444 331 444 311V271Q444 251 464 251H496" stroke="#60A5FA" marker-end="url(#arrowBlue)"/>
    <path d="M388 331H424Q444 331 444 351V423Q444 443 464 443H496" stroke="#A78BFA" marker-end="url(#arrowViolet)"/>
    <path d="M1080 251H1164" stroke="#34D399" marker-end="url(#arrowGreen)"/>
    <path d="M1080 443H1164" stroke="#34D399" marker-end="url(#arrowGreen)"/>
  </g>

  <!-- Request: a single obvious entry point. -->
  <g transform="translate(64 258)" class="sans" filter="url(#shadow)">
    <rect width="324" height="146" rx="24" fill="url(#glass)" stroke="#2A3851"/>
    <text x="28" y="58" class="card-title">Your request</text>
    <text x="28" y="103" class="copy">Start inside Pi</text>
  </g>

  <!-- The two workflow choices are the primary subjects. -->
  <g transform="translate(500 170)" class="sans" filter="url(#shadow)">
    <rect width="580" height="162" rx="26" fill="url(#focus)" stroke="#38517A"/>
    <rect width="5" height="162" rx="2.5" fill="#60A5FA"/>
    <circle cx="46" cy="48" r="19" fill="#60A5FA" fill-opacity="0.16"/>
    <path d="M37 48l6 6 12-13" fill="none" stroke="#93C5FD" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="80" y="59" class="card-title">Recipes</text>
    <text x="32" y="111" class="copy">Named specialists + review gates</text>
    <text x="32" y="144" class="mono" font-size="23" fill="#93C5FD">/recipe-implement</text>
  </g>
  <g transform="translate(500 362)" class="sans" filter="url(#shadow)">
    <rect width="580" height="162" rx="26" fill="url(#focus)" stroke="#51426F"/>
    <rect width="5" height="162" rx="2.5" fill="#A78BFA"/>
    <circle cx="46" cy="48" r="19" fill="#A78BFA" fill-opacity="0.16"/>
    <path d="m38 42 7 6-7 6m11 0h8" fill="none" stroke="#D8B4FE" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="80" y="59" class="card-title">Scripted workflows</text>
    <text x="32" y="111" class="copy">Approve a script → parallel workers</text>
    <text x="32" y="144" class="mono" font-size="23" fill="#C4B5FD">agent() + pipeline()</text>
  </g>

  <!-- Outcomes remain distinct from the choice and its orchestration. -->
  <g transform="translate(1168 170)" class="sans">
    <rect width="368" height="162" rx="24" fill="url(#glass)" stroke="#29493F"/>
    <text x="28" y="59" class="card-title">Product work</text>
    <text x="28" y="105" class="copy">Design, code</text>
    <text x="28" y="139" class="copy">and verification</text>
  </g>
  <g transform="translate(1168 362)" class="sans">
    <rect width="368" height="162" rx="24" fill="url(#glass)" stroke="#29493F"/>
    <text x="28" y="59" class="card-title">Collected results</text>
    <text x="28" y="105" class="copy">Watch, pause, resume</text>
    <text x="28" y="139" class="copy">or save for later</text>
  </g>
</svg>
