name: Pi compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      official-version:
        type: string
        default: ''
      fork-ref:
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: pi-compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    uses: fitchmultz/.github/.github/workflows/pi-compatibility.yml@6ec8741e1d5c7097e9b1f108bb698f5c5cd5d7f5 # main
    with:
      automation-ref: 6ec8741e1d5c7097e9b1f108bb698f5c5cd5d7f5 # main
      official-version: ${{ inputs.official-version }}
      fork-ref: ${{ inputs.fork-ref }}
