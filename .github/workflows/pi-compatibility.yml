name: Pi compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      official-version:
        type: string
        default: ''
      fork-ref:
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: pi-compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    uses: fitchmultz/.github/.github/workflows/pi-compatibility.yml@082c559dde8ea1f899c4403c77e7cd44b1af4407 # fix/npm12-qualification
    with:
      automation-ref: 082c559dde8ea1f899c4403c77e7cd44b1af4407 # fix/npm12-qualification
      official-version: ${{ inputs.official-version }}
      fork-ref: ${{ inputs.fork-ref }}
