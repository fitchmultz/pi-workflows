name: Pi compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      official-version:
        type: string
        default: ''
      fork-ref:
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: pi-compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    uses: fitchmultz/.github/.github/workflows/pi-compatibility.yml@e34d8127d7b4d44647003ae1ab0a568775e0864c # main
    with:
      automation-ref: e34d8127d7b4d44647003ae1ab0a568775e0864c # main
      official-version: ${{ inputs.official-version }}
      fork-ref: ${{ inputs.fork-ref }}
